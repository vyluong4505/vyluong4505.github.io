<!doctype html> 
<html>
<head>
<meta charset="utf-8">
<title>Bài tập môn Thiết kế web</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #F8F9FA; 
        color: #4A4A4A;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px;
        overflow: hidden;
        position: relative;
    }

    /* ---- HIỆU ỨNG BONG BÓNG ĐỒNG BỘ ---- */
    .bubble {
        position: absolute;
        bottom: -40px;
        background: rgba(154, 77, 95, 0.06);
        border: 1px solid rgba(154, 77, 95, 0.15);
        border-radius: 50%;
        pointer-events: none;
        animation: floatUpMain 10s infinite linear;
    }
    .bb1 { width: 30px; height: 30px; left: 15%; animation-delay: 0s; }
    .bb2 { width: 50px; height: 50px; left: 40%; animation-delay: 3s; }
    .bb3 { width: 25px; height: 25px; left: 70%; animation-delay: 1s; }
    .bb4 { width: 40px; height: 40px; left: 88%; animation-delay: 5s; }

    @keyframes floatUpMain {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-1000px) rotate(360deg); opacity: 0; }
    }

    .web-wrapper {
        background-color: #ffffff;
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(154, 77, 95, 0.08);
        border: 1px solid #FFE3E5;
        text-align: center;
        max-width: 900px;
        width: 100%;
        z-index: 2;
    }

    h2 { font-size: 26px; font-weight: 800; color: #9A4D5F; margin-bottom: 30px; }
    .image-container { border-radius: 16px; overflow: hidden; display: inline-block; max-width: 100%; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); border: 4px solid #FFF0F2; }
    .image-container img { display: block; max-width: 100%; height: auto; transition: transform 0.5s ease; }
    .image-container:hover img { transform: scale(1.03); }
</style>
</head>
<body>

    <div class="bubble bb1"></div>
    <div class="bubble bb2"></div>
    <div class="bubble bb3"></div>
    <div class="bubble bb4"></div>

    <div class="web-wrapper">
        <h2>🌸 Hello! Chào mừng đến với Không Gian Bài Tập 🌸</h2>
        <div class="image-container">
            <img src="welcome.gif" width="773" height="580" alt="Welcome GIF"/>
        </div>
    </div>

</body>
</html>
