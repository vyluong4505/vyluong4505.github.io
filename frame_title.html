<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thông tin sinh viên - Nâng cấp</title>
<style>
    body {
        margin: 0;
        padding: 10px 20px;
        background-color: #FFF0F2; /* Màu hồng sữa nhạt nhất để nối vào menu bên dưới */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 140px; /* Tăng nhẹ chiều cao khung để chứa nội dung đầy đặn */
        box-sizing: border-box;
        overflow: hidden;
    }

    /* Chiếc Card chính với hiệu ứng đốm sáng bồng bềnh */
    .profile-card {
        width: 100%;
        max-width: 1300px;
        background: white;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 30px;
        box-shadow: 0 6px 20px rgba(154, 77, 95, 0.12);
        border: 2px solid #FFF0F2;
        position: relative;
        overflow: hidden; /* Để che các đốm sáng bay tràn ra ngoài */
    }

    /* ---- HIỆU ỨNG ĐỐM SÁNG LẤP LÁNH NỀN ---- */
    .sparkle {
        position: absolute;
        background: rgba(24D, 226, 228, 0.6);
        border-radius: 50%;
        pointer-events: none;
        animation: fly 6s infinite linear;
    }
    .sp1 { width: 15px; height: 15px; left: 10%; bottom: -20px; animation-delay: 0s; }
    .sp2 { width: 25px; height: 25px; left: 40%; bottom: -30px; animation-delay: 2s; animation-duration: 8s; }
    .sp3 { width: 12px; height: 12px; left: 70%; bottom: -20px; animation-delay: 4s; }

    @keyframes fly {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(-150px) scale(0.5); opacity: 0; }
    }

    /* Khung bên trái chứa Thỏ avatar */
    .avatar-box {
        display: flex;
        align-items: center;
        z-index: 2;
    }

    .avatar-box img {
        height: 85px;
        width: auto;
        filter: drop-shadow(2px 4px 6px rgba(154, 77, 95, 0.2));
        transition: 0.3s;
    }
    
    /* Hiệu ứng xoay nhẹ đáng yêu khi rê chuột vào chú thỏ */
    .avatar-box img:hover {
        transform: rotate(5deg) scale(1.05);
    }

    /* ---- KHUNG GIỮA: ĐỒNG HỒ HỆ THỐNG MỚI ---- */
    .clock-box {
        text-align: center;
        z-index: 2;
        background: rgba(253, 226, 228, 0.4);
        padding: 8px 20px;
        border-radius: 30px;
        border: 1px solid rgba(154, 77, 95, 0.15);
    }
    #live-time {
        font-size: 22px;
        font-weight: bold;
        color: #9A4D5F;
        margin: 0;
        font-family: 'Courier New', Courier, monospace; /* Định dạng font số điện tử */
    }
    #live-date {
        font-size: 12px;
        color: #5A2B36;
        margin: 2px 0 0 0;
        font-weight: 600;
        text-transform: uppercase;
    }

    /* Khung bên phải chứa thông tin chữ */
    .info-box {
        text-align: right;
        background: #9A4D5F;
        padding: 12px 25px;
        border-radius: 12px;
        color: white;
        min-width: 340px;
        box-shadow: 0 4px 12px rgba(154, 77, 95, 0.2);
        z-index: 2;
    }

    .info-box h2 {
        margin: 0 0 3px 0;
        font-size: 22px;
        font-weight: bold;
        color: #FFF;
    }

    /* Thêm các thẻ tag nhỏ để bổ sung dữ liệu giúp bớt trống */
    .meta-info {
        margin-bottom: 6px;
        font-size: 13px;
        color: #FDE2E4;
        font-weight: 500;
    }
    .badge {
        background: #FFF;
        color: #9A4D5F;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 5px;
    }

    .info-box marquee {
        display: block;
        background: rgba(255, 255, 255, 0.15);
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        color: #FFF;
        border: 1px dashed rgba(255, 255, 255, 0.3);
    }
</style>
</head>

<body>

<div class="profile-card">
    
    <div class="sparkle sp1"></div>
    <div class="sparkle sp2"></div>
    <div class="sparkle sp3"></div>
    
    <div class="avatar-box">
        <img src="thotim6.gif" alt="Thỏ tím">
    </div>
    
    <div class="clock-box">
        <div id="live-time">00:00:00</div>
        <div id="live-date">Thứ Ba, 01/01/2026</div>
    </div>
    
    <div class="info-box">
        <h2>✨ Lương Tường Vy</h2>
        <div class="meta-info">
            🎓 Lớp:  <span class="badge">CN24CD</span> 
            | 🆔 MSSV: 24.CN.CD.029 </div>
        <marquee behavior="scroll" direction="left" scrollamount="5">
            📝 Môn: Thiết kế Website với HTML5 & CSS3 🚀 Hệ thống quản lý bài tập thực hành cá nhân 🌟
        </marquee>
    </div>

</div>

<script>
    function updateClock() {
        const now = new Date();
        
        // Định dạng Giờ : Phút : Giây
        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let seconds = now.getSeconds().toString().padStart(2, '0');
        document.getElementById('live-time').textContent = `${hours}:${minutes}:${seconds}`;
        
        // Định dạng Ngày / Tháng / Năm
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        let dayName = days[now.getDay()];
        let date = now.getDate().toString().padStart(2, '0');
        let month = (now.getMonth() + 1).toString().padStart(2, '0');
        let year = now.getFullYear();
        
        document.getElementById('live-date').textContent = `${dayName}, ${date}/${month}/${year}`;
    }

    // Chạy đồng hồ ngay lập tức và thiết lập cập nhật mỗi 1 giây (1000ms)
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
