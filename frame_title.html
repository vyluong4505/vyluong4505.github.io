<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thông tin sinh viên - Nâng cấp</title>
<style>
    body {
        margin: 0;
        padding: 10px 20px;
        background-color: #FFF5F6; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 150px;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
    }

    /* ---- HIỆU ỨNG BONG BÓNG ĐỒNG BỘ ---- */
    .bubble {
        position: absolute;
        bottom: -20px;
        background: rgba(255, 143, 171, 0.2);
        border: 1px solid rgba(255, 143, 171, 0.4);
        border-radius: 50%;
        pointer-events: none;
        animation: floatUp 7s infinite ease-in;
    }
    .bb1 { width: 20px; height: 20px; left: 10%; animation-delay: 0s; animation-duration: 6s; }
    .bb2 { width: 35px; height: 35px; left: 30%; animation-delay: 1.5s; animation-duration: 8s; }
    .bb3 { width: 15px; height: 15px; left: 55%; animation-delay: 3s; animation-duration: 5s; }
    .bb4 { width: 25px; height: 25px; left: 85%; animation-delay: 0.5s; animation-duration: 7s; }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-180px) scale(0.3); opacity: 0; }
    }

    .profile-card {
        width: 100%;
        max-width: 1400px;
        background: #ffffff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 30px;
        box-shadow: 0 8px 24px rgba(154, 77, 95, 0.15);
        border: 2px solid #FFE3E5;
        z-index: 2;
    }

    .avatar-box img {
        height: 90px;
        width: auto;
        filter: drop-shadow(2px 4px 8px rgba(154, 77, 95, 0.25));
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .avatar-box img:hover { transform: rotate(10deg) scale(1.1); }

    .clock-box {
        text-align: center;
        background: linear-gradient(135deg, #FFF0F2, #FFE3E5);
        padding: 10px 25px;
        border-radius: 30px;
        border: 1px solid rgba(154, 77, 95, 0.2);
    }
    #live-time {
        font-size: 24px;
        font-weight: bold;
        color: #9A4D5F;
        margin: 0;
        font-family: 'Courier New', Courier, monospace;
    }
    #live-date {
        font-size: 11px;
        color: #5A2B36;
        margin-top: 4px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .info-box {
        text-align: right;
        background: linear-gradient(135deg, #9A4D5F, #803C4B);
        padding: 12px 25px;
        border-radius: 14px;
        color: white;
        min-width: 360px;
        box-shadow: 0 4px 15px rgba(154, 77, 95, 0.3);
    }
    .info-box h2 { margin: 0 0 5px 0; font-size: 22px; color: #FFF; }
    .meta-info { margin-bottom: 8px; font-size: 13px; color: #FFE3E5; }
    .badge {
        background: #FFF; color: #9A4D5F; padding: 2px 8px;
        border-radius: 6px; font-size: 11px; font-weight: 800; margin-left: 5px;
    }
    .info-box marquee {
        display: block; background: rgba(255, 255, 255, 0.15);
        padding: 4px 12px; border-radius: 20px; font-size: 13px;
        font-weight: bold; color: #FFF; border: 1px dashed rgba(255, 255, 255, 0.4);
    }
</style>
</head>
<body>

    <div class="bubble bb1"></div>
    <div class="bubble bb2"></div>
    <div class="bubble bb3"></div>
    <div class="bubble bb4"></div>

    <div class="profile-card">
        <div class="avatar-box">
            <img src="thotim6.gif" alt="Thỏ tím">
        </div>
        
        <div class="clock-box">
            <div id="live-time">00:00:00</div>
            <div id="live-date">Đang tải...</div>
        </div>
        
        <div class="info-box">
            <h2>✨ Lương Tường Vy</h2>
            <div class="meta-info">
                🎓 Lớp: <span class="badge">CN24CD</span> | 🆔 MSSV: 24.CN.CD.029 
            </div>
            <marquee behavior="scroll" direction="left" scrollamount="5">
                📝 Môn: Thiết kế Website với HTML5 & CSS3 🚀 Hệ thống quản lý bài tập thực hành cá nhân 🌟
            </marquee>
        </div>
    </div>

<script>
    function updateClock() {
        const now = new Date();
        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let seconds = now.getSeconds().toString().padStart(2, '0');
        document.getElementById('live-time').textContent = hours + ":" + minutes + ":" + seconds;
        
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        document.getElementById('live-date').textContent = days[now.getDay()] + ", " + now.getDate().toString().padStart(2, '0') + "/" + (now.getMonth() + 1).toString().padStart(2, '0') + "/" + now.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>
</body>
</html>
