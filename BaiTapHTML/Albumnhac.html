<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Album Nhạc Du Lịch - Vibe Đi và Đi</title>
<style>
    /* Reset căn lề cơ bản */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        /* Ưu tiên màu nền gradient kẹo ngọt đồng bộ hệ thống, kết hợp hình nền cũ nếu có */
        background: linear-gradient(135deg, #FFF0F2 0%, #FAD2D6 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
        position: relative;
    }

    /* ---- HIỆU ỨNG BONG BÓNG NỀN ĐỒNG BỘ ---- */
    .bubble {
        position: absolute;
        bottom: -20px;
        background: rgba(255, 143, 171, 0.2);
        border: 1px solid rgba(255, 143, 171, 0.3);
        border-radius: 50%;
        pointer-events: none;
        animation: floatUpTrack 8s infinite linear;
    }
    .bb1 { width: 30px; height: 30px; left: 10%; animation-delay: 0s; }
    .bb2 { width: 45px; height: 45px; left: 75%; animation-delay: 2s; }
    .bb3 { width: 20px; height: 20px; left: 85%; animation-delay: 4s; }

    @keyframes floatUpTrack {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-800px) scale(0.5); opacity: 0; }
    }

    /* ---- PLAYER CONTAINER ---- */
    .album-container {
        background: #ffffff;
        width: 100%;
        max-width: 650px;
        padding: 35px;
        border-radius: 24px;
        box-shadow: 0 12px 35px rgba(154, 77, 95, 0.15);
        border: 2px solid #FFE3E5;
        text-align: center;
        z-index: 2;
    }

    .album-header h1 {
        color: #9A4D5F;
        font-size: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 25px;
        text-shadow: 1px 1px 0px #FFF;
    }

    /* ---- DANH SÁCH BÀI HÁT ---- */
    .playlist {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .track-item {
        background: #FFF5F6;
        border: 1px solid rgba(154, 77, 95, 0.1);
        border-radius: 16px;
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        transition: all 0.3s ease;
    }

    .track-item:hover {
        transform: translateY(-3px);
        background: #FFF;
        box-shadow: 0 6px 15px rgba(154, 77, 95, 0.1);
        border-color: #FF8FAB;
    }

    .track-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .track-icon {
        font-size: 22px;
        animation: pulse 1.5s infinite alternate;
    }

    .track-name {
        font-size: 18px;
        font-weight: 700;
        color: #5A2B36;
    }

    .track-meta {
        font-size: 13px;
        color: #9A4D5F;
        font-weight: 500;
        background: rgba(255, 143, 171, 0.15);
        padding: 2px 8px;
        border-radius: 6px;
        margin-left: 5px;
    }

    /* ---- GIAO DIỆN THANH AUDIO CHUẨN ---- */
    audio {
        width: 100%;
        height: 40px;
        outline: none;
    }

    /* Tùy biến nhẹ thanh audio trên các trình duyệt hiện đại */
    audio::-webkit-media-controls-panel {
        background-color: #FFE3E5;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.15); }
    }
</style>
</head>

<body>

    <!-- Bong bóng bay lãng mạn phía nền -->
    <div class="bubble bb1"></div>
    <div class="bubble bb2"></div>
    <div class="bubble bb3"></div>

    <div class="album-container">
        
        <div class="album-header">
            <h1>🎧 Lofi Trip: Đi và Trải Nghiệm 🏖️</h1>
        </div>

        <div class="playlist">
            
            <!-- BÀI 1: Ờ THÌ ĐI -->
            <div class="track-item">
                <div class="track-info">
                    <span class="track-icon">🚀</span>
                    <span class="track-name">Ờ Thì Đi!</span>
                    <span class="track-meta">Vibe: Tự do</span>
                </div>
                <!-- Thẻ audio giúp phát nhạc trực tiếp không chuyển trang -->
                <audio controls>
                    <source src="ờ thì đi!.mp3" type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh.
                </audio>
            </div>

            <!-- BÀI 2: CÙNG ANH -->
            <div class="track-item">
                <div class="track-info">
                    <span class="track-icon">🌅</span>
                    <span class="track-name">Cùng Anh</span>
                    <span class="track-meta">Vibe: Đi trốn</span>
                </div>
                <audio controls>
                    <source src="Cùng Anh.mp3" type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh.
                </audio>
            </div>

            <!-- BÀI BỔ SUNG THÊM CHO ĐẦY ĐẶN ĐẸP MẮT (Vy có thể đổi tên file theo ý muốn nhé) -->
            <div class="track-item">
                <div class="track-info">
                    <span class="track-icon">🎒</span>
                    <span class="track-name">Đi Để Trở Về</span>
                    <span class="track-meta">Vibe: Thanh xuân</span>
                </div>
                <audio controls>
                    <source src="Đi Để Trở Về Mashup.mp3" type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh.
                </audio>
            </div>

        </div>

    </div>

</body>
</html>
